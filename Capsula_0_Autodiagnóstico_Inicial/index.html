<p><p>Antes de comenzar la formación: </p>Te invitamos a explorar <strong>cómo valoras tu preparación actual</strong> para afrontar diferentes retos de liderazgo y dirección educativa.</p>

<p>Queremos que identifiques <strong>qué decisiones y herramientas tienes claras hoy</strong> y <strong>cuáles te gustaría comprender mejor</strong>.</p>
<div class="callout"><strong>Cómo responder</strong><p style="margin:8px 0 0">Piensa en cómo afrontarías cada reto <strong>con los conocimientos que tienes ahora, antes de realizar la formación</strong>. Aunque nunca hayas vivido una situación similar, valora hasta qué punto sabes cómo abordarla.</p></div>
<p class="muted">Duración orientativa: <strong>3-4 minutos</strong>.</p>
<div class="btnrow" style="justify-content:flex-end"><button class="btn btn-primary" onclick="showEmail()">Comenzar <span aria-hidden="true">→</span></button></div></section>`;}
function renderDots(current,total){return `<div class="stepdots">${Array.from({length:total},(_,i)=>`<span class="${i<current?'done':i===current?'current':''}"></span>`).join('')}</div>`}
function renderInitialQuestion(){const q=initialQuestions[index], cap=q.c;setProgress((index/22)*100);topLabel.textContent='Diagnóstico inicial';const qnumber=index+1;const old=answersInitial[`p${qnumber}`]||'';const scale=q.type==='claridad'?initialScale:criteriaScale;app.innerHTML=`<section class="card"><div class="question-meta"><span class="pill">Cápsula ${cap} · ${escapeHTML(capsuleNames[cap-1])}</span><span class="count">Pregunta ${qnumber} de 20</span></div>${index%2===0?`<p class="capsule-context">${initialIntro[cap]}</p>`:''}<h2>${escapeHTML(q.q)}</h2><p class="muted small">Selecciona del 1 al 5 cuánto tienes claro cómo abordar lo que plantea la pregunta.</p><div class="level-options" role="radiogroup" aria-label="Escala de respuesta">${[1,2,3,4,5].map((n,i)=>`<label class="level ${String(i+1)===String(old)?'selected':''}"><input type="radio" name="rating" value="${i+1}" aria-label="${i+1} de 5" ${String(i+1)===String(old)?'checked':''}><span class="num">${i+1}</span></label>`).join('')}</div><div class="scale-legend" aria-label="Significado de la escala"><div class="scale-legend-item"><strong>1 · Nada claro</strong><span>No sé cómo abordarlo.</span></div><div class="scale-legend-item"><strong>3 · Claridad parcial</strong><span>Tengo una idea general.</span></div><div class="scale-legend-item"><strong>5 · Muy claro</strong><span>Sé cómo abordarlo.</span></div></div>${renderDots(index,22)}<div class="btnrow"><button class="btn btn-secondary" ${index===0?'disabled':''} onclick="index--;renderInitialQuestion()">← Anterior</button><button class="btn btn-primary" onclick="saveInitialAnswer()">${index===19?'Continuar al objetivo personal':'Siguiente →'}</button></div><div id="msg"></div></section>`;document.querySelectorAll('input[name="rating"]').forEach(el=>el.addEventListener('change',()=>{document.querySelectorAll('.level').forEach(l=>l.classList.remove('selected'));el.closest('.level').classList.add('selected')}));}
function saveInitialAnswer(){const selected=document.querySelector('input[name="rating"]:checked');if(!selected){showMsg('Selecciona una respuesta para continuar.','error');return}answersInitial[`p${index+1}`]=Number(selected.value);if(index<19){index++;renderInitialQuestion()}else{showPersonalQuestions()}}
function showPersonalQuestions(){setProgress(91);topLabel.textContent='Tu objetivo de aprendizaje';app.innerHTML=`<section class="card">${header('Tu objetivo de aprendizaje','Dos preguntas para conectar la formación con tu desarrollo profesional.')}
<div class="field"><label for="priority">21. De las competencias trabajadas en este autodiagnóstico, ¿cuál te gustaría desarrollar especialmente durante la formación?</label><p class="small muted">Elige una sola competencia. No tiene que ser necesariamente la de menor puntuación, sino la que consideres más importante para tu desarrollo.</p><select id="priority" required><option value="">Selecciona una competencia</option>${capsuleNames.map((n,i)=>`<option value="${i+1}" ${String(i+1)===priority?'selected':''}>${i+1}. ${escapeHTML(n)}</option>`).join('')}</select></div>
<div class="field"><label for="situation">22. En relación con la competencia que acabas de elegir, ¿qué situación profesional te gustaría sentirte mejor preparado/a para afrontar después de la formación?</label><p class="small muted">Describe brevemente una situación concreta, real o hipotética. Recuperaremos tu respuesta en el informe final.</p><textarea id="situation" maxlength="2000" required placeholder="Describe una situación profesional relacionada con la competencia elegida...">${escapeHTML(situation)}</textarea><div class="fine">Máximo 2.000 caracteres.</div></div><div class="btnrow"><button class="btn btn-secondary" onclick="index=19;renderInitialQuestion()">← Volver a preguntas</button><button id="submitBtn" class="btn btn-primary" onclick="finishInitial()">Finalizar y guardar</button></div><div id="msg"></div></section>`;}
function finishInitial(){
  priority=document.getElementById('priority').value;
  situation=document.getElementById('situation').value.trim();
  if(!priority){showMsg('Selecciona una competencia prioritaria.','error');return}
  if(!situation){showMsg('Describe una situación profesional relacionada con la competencia elegida.','error');return}
  submitInitial();
}
function showMsg(text,type='error'){let box=document.getElementById('msg');if(box)box.innerHTML=`<div class="status ${type}" role="alert">${escapeHTML(text)}</div>`}
async function submitInitial(){if(busy)return;busy=true;const btn=document.getElementById('submitBtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Guardando...'}try{const data=await postAPI({accion:'enviar_inicial',email,respuestas:answersInitial,competencia_prioritaria:Number(priority),situacion_profesional:situation});renderInitialResults(data.puntuaciones)}catch(e){showMsg(e.message,'error');if(btn){btn.disabled=false;btn.textContent='Reintentar envío'}}finally{busy=false}}
function levelColor(score,kind){if(kind==='initial')return score>=4?'good':score<2?'warn':'';return score>=3.25?'good':score<1.75?'warn':''}
function renderBars(items,max,labelFn){return `<div class="bars">${items.map(x=>`<div class="bar-item"><div class="bar-head"><strong>${escapeHTML(labelFn(x))}</strong><span>${Number(x.puntuacion).toFixed(2).replace('.',',')} / ${max}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,x.puntuacion/max*100))}%"></div></div></div>`).join('')}</div>`}
function renderInitialResults(scores){setProgress(100);topLabel.textContent='Tu punto de partida';app.innerHTML=`<section class="card">${header('Tu mapa de preparación inicial','Este resultado refleja cómo valoras tu claridad y conocimiento antes de comenzar la formación.')}
<div class="result-hero"><div class="eyebrow">Preparación percibida · Resultado global</div><div class="score">${scores.global.puntuacion.toFixed(2).replace('.',',')} / 5</div><strong>${escapeHTML(scores.global.nivel)}</strong><p style="margin:8px 0 0">Esta puntuación describe tu punto de partida percibido; no es una evaluación objetiva de tu desempeño como líder.</p></div>
<h3 class="section-title">Tus cinco grandes competencias</h3>${renderBars(scores.grandes_competencias,5,x=>groupNames[x.id-1])}
<div class="objective-section"><h3>Tu objetivo personal</h3><p><strong>Competencia prioritaria:</strong> ${escapeHTML(capsuleNames[Number(priority)-1])}</p><p><strong>Tu situación profesional:</strong></p><div class="personal-reflection">${escapeHTML(situation)}</div><p style="margin:14px 0 0">Al finalizar la formación, volveremos a este objetivo y conectaremos tu punto de partida con las decisiones que tomes en las situaciones finales.</p></div>
<div class="status success">Tu diagnóstico inicial se ha guardado correctamente. Utiliza el mismo correo al completar el diagnóstico final.</div></section>`;}

showIntroInitial();
</script>
