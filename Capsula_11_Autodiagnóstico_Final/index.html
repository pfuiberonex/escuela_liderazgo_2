function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setProgress(p){progress.style.width=`${Math.max(0,Math.min(100,p))}%`}
function apiErrorMessage(data,status){if(data?.codigo==='YA_COMPLETADO')return 'Ya existe un envío de este diagnóstico con ese correo. Solo se admite un envío por diagnóstico y correo.';return data?.mensaje||`No se pudo completar la operación (HTTP ${status}). Comprueba la conexión y vuelve a intentarlo.`}
async function postAPI(body){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data;try{data=await r.json()}catch{throw new Error(`El servidor respondió con HTTP ${r.status}, pero no devolvió un resultado legible.`)}if(!r.ok||data.ok===false){let e=new Error(apiErrorMessage(data,r.status));e.status=r.status;e.data=data;throw e}return data}

async function loadStatusForFinal(){
  // Comprueba si ya existe un diagnóstico final para evitar que el alumno vuelva a recorrerlo.
  try {
    const data = await postAPI({accion:'obtener_informe',email});
    if (data?.informe?.perfil_final) {
      setProgress(100);
      app.innerHTML=`<section class="card">${header('Tu diagnóstico final ya está completado','Ya existe un envío final para este correo.')}
      <div class="status success">No necesitas volver a responder las veinte situaciones. Puedes consultar el informe que se generó con tu envío anterior.</div>
      <div class="btnrow"><span class="fine">Autodiagnóstico final · IBERONEX</span><button class="btn btn-primary" onclick="loadExistingReport()">Consultar mi informe →</button></div></section>`;
      return;
    }
    renderFinalQuestion();
  } catch (e) {
    if (e.status === 404 || e.data?.codigo === 'SIN_RESULTADOS') { renderFinalQuestion(); return; }
    // Si la API de consulta no está disponible, no bloqueamos la evaluación; la operación de envío
    // seguirá aplicando la restricción de un único registro en la base de datos.
    renderFinalQuestion();
  }
}

function renderDots(current,total){return `<div class="stepdots">${Array.from({length:total},(_,i)=>`<span class="${i<current?'done':i===current?'current':''}"></span>`).join('')}</div>`}
function showMsg(text,type='error'){let box=document.getElementById('msg');if(box)box.innerHTML=`<div class="status ${type}" role="alert">${escapeHTML(text)}</div>`}
function levelColor(score,kind){if(kind==='initial')return score>=4?'good':score<2?'warn':'';return score>=3.25?'good':score<1.75?'warn':''}
function renderBars(items,max,labelFn){return `<div class="bars">${items.map(x=>`<div class="bar-item"><div class="bar-head"><strong>${escapeHTML(labelFn(x))}</strong><span>${Number(x.puntuacion).toFixed(2).replace('.',',')} / ${max}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,x.puntuacion/max*100))}%"></div></div></div>`).join('')}</div>`}
const contextHighlights = {
  1:['sus reuniones se han vuelto tensas','Todavía no hay ataques personales'],
  2:['poco entusiasmo','más responsabilidades','el reconocimiento','no tiene impacto visible'],
  3:['hay dudas sobre sus efectos','tiempo para ensayar cambios'],
  4:['reaccionando emocionalmente'],
  5:['te consulta decisiones menores','revisas frecuentemente los detalles'],
  6:['no se han investigado bien las causas'],
  7:['inconsistencias','no ser consciente del impacto'],
  8:['no hay presupuesto para cubrirlos completamente'],
  9:['no está claro quién debe resolver cada asunto'],
  10:['no sabe si le interesa gestionar equipos'],
  11:['teme más carga de trabajo','la comunicación ha sido insuficiente'],
  12:['algunos detalles aún pueden acordarse'],
  13:['intercambiando reproches'],
  14:['no ve cómo contribuye a los objetivos educativos'],
  15:['se desconoce su utilidad','recursos para una prueba limitada'],
  16:['gran experiencia técnica pero poco tiempo','menos experiencia, mucha motivación'],
  17:['por primera vez','necesita orientación'],
  18:['otros proveedores','costes y riesgos'],
  19:['Desconoces si ambos quieren liderar'],
  20:['dudas en privado','errores se comunican tarde']
};
function emphasizeSituation(text,caseNum){
  const highlights=contextHighlights[caseNum]||[];
  const re=new RegExp('('+highlights.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  if(!highlights.length)return escapeHTML(text);
  return String(text).split(re).map(part=>highlights.some(term=>term.toLowerCase()===part.toLowerCase())?`<strong>${escapeHTML(part)}</strong>`:escapeHTML(part)).join('');
}
function renderFinalQuestion(){const c=cases[index];setProgress(index/20*100);topLabel.textContent='Diagnóstico final';app.innerHTML=`<section class="card"><div class="question-meta"><span class="pill">Situación profesional</span><span class="count">Caso ${index+1} de 20</span></div><p class="question-context">${emphasizeSituation(c.q,index+1)}</p><h2>¿Qué actuación consideras más adecuada?</h2><p class="muted">Selecciona una única alternativa. Todas representan formas posibles de actuar; valora el contexto y los criterios trabajados durante la formación.</p><div class="choices">${Object.entries(c.o).map(([k,v])=>`<label class="choice ${answersFinal[`s${index+1}`]===k?'selected':''}"><input type="radio" name="caseAnswer" value="${k}" ${answersFinal[`s${index+1}`]===k?'checked':''}><span><strong>${k}.</strong> ${escapeHTML(v)}</span></label>`).join('')}</div>${renderDots(index,20)}<div class="btnrow"><button class="btn btn-secondary" ${index===0?'disabled':''} onclick="index--;renderFinalQuestion()">← Anterior</button><button ${index===19?'id="submitBtn"':''} class="btn btn-primary" onclick="saveFinalAnswer()">${index===19?'Finalizar y guardar':'Siguiente →'}</button></div><div id="msg"></div></section>`;document.querySelectorAll('input[name="caseAnswer"]').forEach(el=>el.addEventListener('change',()=>{document.querySelectorAll('.choice').forEach(l=>l.classList.remove('selected'));el.closest('.choice').classList.add('selected')}));}
function saveFinalAnswer(){const selected=document.querySelector('input[name="caseAnswer"]:checked');if(!selected){showMsg('Selecciona una alternativa para continuar.','error');return}answersFinal[`s${index+1}`]=selected.value;if(index<19){index++;renderFinalQuestion()}else{submitFinal()}}
async function submitFinal(){if(busy)return;busy=true;const btn=document.getElementById('submitBtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Guardando...'}try{await postAPI({accion:'enviar_final',email,respuestas:answersFinal});await loadExistingReport(true)}catch(e){if(e.status===409||e.data?.codigo==='YA_COMPLETADO'){showFinalDuplicateMessage();}else{showMsg(e.message,'error');if(btn){btn.disabled=false;btn.textContent='Reintentar envío'}}}finally{busy=false}}
function showFinalDuplicateMessage(){setProgress(100);app.innerHTML=`<section class="card">${header('Este diagnóstico ya está registrado','Solo se admite un envío final por correo electrónico.')}
<div class="status info">Ya existe un diagnóstico final asociado a este correo. No se ha creado otro registro.</div><p>Puedes consultar el informe del diagnóstico que ya completaste.</p><div class="btnrow"><button class="btn btn-secondary" onclick="showHome()">Volver al inicio</button><button class="btn btn-primary" onclick="loadExistingReport()">Consultar informe</button></div><div id="msg"></div></section>`}
async function loadExistingReport(afterSave=false){if(busy&& !afterSave)return;const previousBusy=busy;busy=true;setProgress(100);topLabel.textContent='Tu informe de liderazgo';app.innerHTML=`<section class="card">${header('Preparando tu informe','Estamos recuperando los resultados disponibles para este correo.') }<div class="status info"><span class="spinner"></span> Consultando resultados…</div></section>`;try{const response=await postAPI({accion:'obtener_informe',email});renderFinalResults(response)}catch(e){app.innerHTML=`<section class="card">${header(afterSave?'Tu diagnóstico se ha guardado':'No se ha podido recuperar el informe',afterSave?'El envío está registrado, pero no hemos podido cargar el informe en este momento.':'Comprueba el correo que has introducido e inténtalo de nuevo.')}
<div class="status ${afterSave?'info':'error'}">${escapeHTML(e.message)}</div><p class="small muted">${afterSave?'No vuelvas a enviar el cuestionario. Puedes reintentar únicamente la consulta del informe.':'Si todavía no has completado el diagnóstico final, primero debes realizarlo.'}</p><div class="btnrow"><button class="btn btn-secondary" onclick="showHome()">Volver al inicio</button><button class="btn btn-primary" onclick="loadExistingReport(${afterSave?'true':'false'})">Reintentar consulta</button></div></section>`}finally{busy=previousBusy}}
function renderRadar(items){
  const ordered=[1,2,3,4,5].map(id=>items.find(x=>Number(x.id)===id)||{id,puntuacion:0,nombre:groupNames[id-1]});
  const cx=460,cy=295,r=193;
  const angle=i=>-Math.PI/2+i*Math.PI*2/5;
  const xy=(i,t)=>[cx+Math.cos(angle(i))*r*t,cy+Math.sin(angle(i))*r*t];
  const points=distance=>ordered.map((_,i)=>xy(i,distance).map(n=>n.toFixed(1)).join(',')).join(' ');
  const rings=[1,2,3,4].map(n=>`<polygon points="${points(n/4)}" fill="${n%2?'#f8f7fc':'#fffcf2'}" fill-opacity="0.9" stroke="#c9c8df" stroke-width="1.5"/>`).join('');
  const axes=ordered.map((_,i)=>{const [x,y]=xy(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#a6a4c8" stroke-width="1.5"/>`}).join('');
  const plotPoints=ordered.map((x,i)=>xy(i,Math.max(0,Math.min(4,Number(x.puntuacion)||0))/4));
  const shape=plotPoints.map(x=>x.map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots=plotPoints.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="7" fill="#FFBF00" stroke="#06065B" stroke-width="2.5"><title>${escapeHTML(ordered[i].nombre||groupNames[i])}: ${Number(ordered[i].puntuacion).toFixed(2).replace('.',',')} de 4</title></circle>`).join('');
  const names=[['Liderazgo personal','y comunicación'],['Compromiso y','equipos'],['Conflictos y','negociación'],['Empoderamiento','y talento'],['Transformación','e innovación']];
  const labels=names.map((parts,i)=>{const [x,y]=xy(i,1.31);const anchor=x>cx+45?'start':x<cx-45?'end':'middle';const yy=y-(parts.length-1)*9;return `<text class="radar-axis-label" x="${x}" y="${yy}" fill="#06065B" text-anchor="${anchor}" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="600">${parts.map((p,j)=>`<tspan x="${x}" dy="${j===0?0:22}">${escapeHTML(p)}</tspan>`).join('')}</text>`}).join('');
  const ticks=[1,2,3,4].map(n=>`<text x="${cx+9}" y="${(cy-r*n/4+13).toFixed(1)}" fill="#535376" font-size="15" font-family="Inter,Arial,sans-serif">${n}</text>`).join('');
  const mobile=typeof window!=='undefined'&&window.matchMedia('(max-width:620px)').matches;
  const vb=mobile?'225 55 470 480':'0 0 920 625';
  return `<div class="radar-container"><p class="radar-caption">Cada eje representa una competencia. Cuanto más alejado del centro, mayor es la puntuación obtenida (de 1 a 4).</p><svg viewBox="${vb}" role="img" aria-label="Gráfico radial de las cinco grandes competencias: ${escapeHTML(ordered.map((x,i)=>`${groupNames[i]}, ${Number(x.puntuacion).toFixed(2)} de 4`).join('; '))}"><title>Tu perfil de liderazgo en cinco competencias</title><desc>Los cinco ejes muestran las puntuaciones de aplicación sobre cuatro puntos. La lista situada debajo detalla los valores.</desc>${rings}${axes}<polygon points="${shape}" fill="#FFBF00" fill-opacity="0.31" stroke="#06065B" stroke-width="4" stroke-linejoin="round"/>${dots}${ticks}${mobile?'':labels}</svg><ol class="radar-key">${ordered.map((x,i)=>`<li><span class="radar-key-num">${i+1}</span><span>${escapeHTML(x.nombre||groupNames[i])}</span><span class="radar-key-score">${Number(x.puntuacion).toFixed(2).replace('.',',')} / 4</span></li>`).join('')}</ol></div>`;
}
const feedbackHighlights = [
  'criterios principales','hechos y necesidades','coherencia','orientación general','bastantes dudas',
  'claridad','confianza','autonomía','responsabilidades','evidencias','compromiso',
  'acompañamiento','influencia','negociación','aprendizaje','respeto'
];
function emphasizeFeedback(text){
  const s=String(text??'');
  const pattern=new RegExp('('+feedbackHighlights.join('|')+')','gi');
  return s.split(pattern).map(part=>feedbackHighlights.some(x=>x.toLowerCase()===part.toLowerCase())?`<strong>${escapeHTML(part)}</strong>`:escapeHTML(part)).join('');
}
function renderFinalResults(reportResponse){setProgress(100);topLabel.textContent='Tu informe de liderazgo';const report=reportResponse?.informe||null;if(!report||!report.perfil_final||!Array.isArray(report.competencias)){app.innerHTML=`<section class="card">${header('No se ha podido preparar el informe','La API no ha devuelto la estructura de resultados esperada.')}
<div class="status error">No se ha mostrado el informe para evitar presentar información incompleta.</div><div class="btnrow"><button class="btn btn-secondary" onclick="showHome()">Volver al inicio</button><button class="btn btn-primary" onclick="loadExistingReport()">Reintentar consulta</button></div></section>`;return}
const initial=report.perfil_inicial||null;const finalProfile=report.perfil_final;const comps=report.competencias||[];const objective=report.objetivo_personal||null;const initialAvailable=Boolean(report.diagnostico_inicial_disponible&&initial);const globalScore=Number(finalProfile.puntuacion_global||0);const bigs=Array.isArray(finalProfile.grandes_competencias)?finalProfile.grandes_competencias:[];
const scoreLabel=(n,max)=>`${Number(n).toFixed(2).replace('.',',')} / ${max}`;
const itemCard=(x,type)=>`<div class="mini-card"><h4>${escapeHTML(x.competencia||capsuleNames[Number(x.capsula)-1]||'Competencia')}</h4><span class="tag ${Number(x.puntuacion)>=3?'good':Number(x.puntuacion)<2?'warn':''}">${scoreLabel(x.puntuacion,4)}</span>${type==='fortaleza'?(x.explicacion?`<p style="margin-top:14px">${escapeHTML(x.explicacion)}</p>`:''):(x.recomendacion?`<p style="margin-top:14px"><strong>Siguiente paso:</strong> ${escapeHTML(x.recomendacion)}</p>`:'')}</div>`;
let html=`<section class="card">${header('Este es tu perfil de liderazgo','Este informe resume cómo has aplicado los criterios de liderazgo en veinte situaciones profesionales. No es una medición directa de tu desempeño laboral.')}
<div class="result-hero"><div class="eyebrow">Resultado global · Aplicación situacional</div><div class="score">${scoreLabel(globalScore,4)}</div><strong>${escapeHTML(finalProfile.nivel_global||'')}</strong><p class="small" style="margin:8px 0 0">El resultado se basa en las decisiones que seleccionaste en las situaciones finales. No mide directamente tu desempeño cotidiano.</p></div>
<h3 class="section-title">Tus cinco grandes competencias</h3>${renderRadar(bigs)}
<h3 class="section-title">Fortalezas principales</h3><div class="two-col">${(report.fortalezas||[]).length?report.fortalezas.map(x=>itemCard(x,'fortaleza')).join(''):'<p class="small muted">Tu perfil no presenta una fortaleza claramente diferenciada. Revisa el detalle de las competencias.</p>'}</div>
<h3 class="section-title">Oportunidades para seguir desarrollándote</h3><div class="two-col">${(report.oportunidades_de_desarrollo||[]).length?report.oportunidades_de_desarrollo.map(x=>itemCard(x,'oportunidad')).join(''):'<p class="small muted">No se identificaron oportunidades prioritarias con las reglas actuales. Revisa las diez competencias para decidir próximos pasos.</p>'}</div>
<h3 class="section-title">Tu recorrido por las diez cápsulas</h3><p class="small muted">El punto de partida inicial describe tu preparación percibida; el resultado final describe la aplicación de criterios en situaciones. Son indicadores distintos y no se comparan como una mejora numérica.</p>`;
for(const c of comps){const cap=Number(c.capsula);const init=c.preparacion_inicial;const priorityOpen=objective&&Number(objective.competencia_prioritaria_id)===cap;html+=`<details class="report-item" ${priorityOpen?'open':''}><summary><span>${cap}. ${escapeHTML(c.competencia||capsuleNames[cap-1])}</span><span class="tag ${Number(c.puntuacion_final)>=3.25?'good':Number(c.puntuacion_final)<1.75?'warn':''}">${scoreLabel(c.puntuacion_final??0,4)}</span></summary><div class="report-body"><h4>Tu punto de partida</h4><p>${initialAvailable&&init?emphasizeFeedback(init.explicacion||`Antes del curso, tu preparación percibida era: ${init.nivel}.`):'No encontramos un diagnóstico inicial asociado a este correo. Este apartado no se puede comparar con un punto de partida anterior.'}</p>${initialAvailable&&init?`<p class="small muted">Nivel de preparación percibida: <strong>${escapeHTML(init.nivel||'')}</strong> (${scoreLabel(init.puntuacion,5)}). Esta valoración refleja tu propia percepción inicial, no una medición objetiva del desempeño.</p>`:''}<h4>Lo que muestra tu diagnóstico final</h4><p>${emphasizeFeedback(c.explicacion_final||'El resultado final resume la adecuación de las decisiones seleccionadas en las situaciones de esta competencia.')}</p><h4>Tu siguiente paso</h4><p>${emphasizeFeedback(c.recomendacion||'Revisa los criterios principales de esta competencia y busca una oportunidad para aplicarlos en una situación profesional.')}</p></div></details>`;}
if(objective){html+=`<h3 class="section-title">Tu objetivo personal al comenzar</h3><div class="callout"><p><strong>Competencia que elegiste desarrollar</strong><br>${escapeHTML(objective.competencia_prioritaria||'')}</p><p><strong>Tu respuesta literal</strong></p><div class="quote">${escapeHTML(objective.situacion_profesional_literal||'')}</div><p class="small" style="margin-top:10px">${escapeHTML(objective.interpretacion||'Este objetivo está relacionado con los criterios de la cápsula elegida.')}</p><h4 style="margin-top:16px">Cómo puedes continuar</h4><p>${escapeHTML(comps.find(c=>Number(c.capsula)===Number(objective.competencia_prioritaria_id))?.recomendacion||'Elige una situación próxima en la que puedas aplicar los criterios trabajados.')}</p></div>`}else{html+=`<h3 class="section-title">Tu punto de partida</h3><div class="callout"><strong>No encontramos un diagnóstico inicial asociado a este correo.</strong><p class="small" style="margin:6px 0 0">Este informe se basa únicamente en el diagnóstico situacional final. Si esperabas ver tu punto de partida, revisa que utilizaste el mismo correo en ambos cuestionarios.</p></div>`}
html+=`<div class="status success">Tu informe se ha recuperado correctamente.</div><p class="fine">Las puntuaciones reflejan las respuestas al cuestionario situacional y las reglas de valoración del instrumento; no sustituyen la observación del desempeño profesional.</p><div class="btnrow"><button class="btn btn-secondary" onclick="showHome()">Volver al inicio</button></div></section>`;app.innerHTML=html;}
function renderInitialResultsPlaceholder(){}
showIntroFinal();
</script>
